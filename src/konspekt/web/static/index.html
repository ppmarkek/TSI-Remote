<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Конспект</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app" hidden>
      <aside class="sidebar" aria-label="Навигация">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round">
              <path d="M6 3.5v17" stroke="currentColor" stroke-width="1.7" />
              <path d="M6 13.5 16.5 3.5M9.6 10.2l8 10.3" stroke="currentColor" stroke-width="1.7" />
              <path d="M8.3 14.2h4.4M8.3 17.1h4.4M8.3 20h4.4" stroke="var(--accent)" stroke-width="1.6" />
            </svg>
          </span>
          Конспект
        </div>
        <button type="button" class="btn btn-primary btn-block" id="add-lecture">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          Добавить лекцию
        </button>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-spacer"></div>
        <div class="dock" id="dock" aria-live="polite"></div>
      </aside>
      <main class="view" id="view"></main>
    </div>
    <div class="boot" id="boot">
      <div class="spinner spinner-lg" role="status" aria-label="Загрузка"></div>
    </div>
    <div id="modal-root"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
