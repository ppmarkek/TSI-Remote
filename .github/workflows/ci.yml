name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  build-artifacts:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      # Keep in sync with scripts/build_konspekt.ps1.
      TESSDATA_REF: 87416418657359cb625c412a48b6e1d6d41c29bd
      RUS_TRAINEDDATA_SHA256: e16e5e036cce1d9ec2b00063cf8b54472625b9e14d893a169e2b0dedeb4df225
      TESSERACT_WINDOWS_VERSION: 5.4.0.20240606
      TESSERACT_WINDOWS_INSTALLER_SHA256: c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,local-ai]"

      - name: Install Tesseract OCR runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Russian OCR model (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tessdata_dir="$(brew --prefix)/share/tessdata"
          mkdir -p "$tessdata_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${TESSDATA_REF}/rus.traineddata" \
            --output "$tessdata_dir/rus.traineddata"
          test -s "$tessdata_dir/eng.traineddata"
          test -s "$tessdata_dir/rus.traineddata"
          tesseract --list-langs 2>&1 | grep -qx eng
          tesseract --list-langs 2>&1 | grep -qx rus

      - name: Install Tesseract OCR runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The pinned UB-Mannheim installer comes first (GitHub release, then the
          # UB-Mannheim server, both checked against one SHA256); Chocolatey is the
          # last resort. Every source is retried with backoff.
          $tesseractRoot = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $tesseract = Join-Path $tesseractRoot "tesseract.exe"
          $version = $env:TESSERACT_WINDOWS_VERSION
          $installerName = "tesseract-ocr-w64-setup-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP $installerName

          function Install-PinnedInstaller([string] $Uri) {
            Invoke-WebRequest -Uri $Uri -OutFile $installer
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($hash -ne $env:TESSERACT_WINDOWS_INSTALLER_SHA256) {
              Remove-Item -LiteralPath $installer -Force
              throw "SHA256 mismatch for ${installerName}: got $hash."
            }
            $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$installerName exited with code $($process.ExitCode)."
            }
          }

          $sources = [ordered]@{
            "GitHub release UB-Mannheim/tesseract v$version" = {
              Install-PinnedInstaller "https://github.com/UB-Mannheim/tesseract/releases/download/v$version/$installerName"
            }
            "digi.bib.uni-mannheim.de $version" = {
              Install-PinnedInstaller "https://digi.bib.uni-mannheim.de/tesseract/$installerName"
            }
            "Chocolatey (latest tesseract package)" = {
              choco install tesseract -y --no-progress
              # 1641 and 3010 mean "installed, reboot required".
              if ($LASTEXITCODE -notin 0, 1641, 3010) {
                throw "choco install exited with code $LASTEXITCODE."
              }
            }
          }

          $attempts = 3
          $failures = @()
          $installedFrom = $null
          foreach ($source in $sources.GetEnumerator()) {
            for ($attempt = 1; $attempt -le $attempts -and -not $installedFrom; $attempt++) {
              try {
                & $source.Value
                if (-not (Test-Path -LiteralPath $tesseract)) { throw "$tesseract was not created." }
                $installedFrom = $source.Key
              } catch {
                $failures += "$($source.Key), attempt ${attempt}/${attempts}: $($_.Exception.Message)"
                Write-Warning $failures[-1]
                if ($attempt -lt $attempts) { Start-Sleep -Seconds (15 * [math]::Pow(2, $attempt - 1)) }
              }
            }
            if ($installedFrom) { break }
          }
          if (-not $installedFrom) {
            throw ("Tesseract OCR could not be installed from any source:`n  " + ($failures -join "`n  "))
          }

          Write-Host "Installed Tesseract OCR from $installedFrom."
          & $tesseract --version
          $tesseractRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Russian OCR model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tesseractRoot = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $tessdataDir = Join-Path $tesseractRoot "tessdata"
          $rusModel = Join-Path $tessdataDir "rus.traineddata"
          New-Item -ItemType Directory -Force -Path $tessdataDir | Out-Null
          $uri = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$env:TESSDATA_REF/rus.traineddata"
          Invoke-WebRequest -Uri $uri -OutFile $rusModel -MaximumRetryCount 4 -RetryIntervalSec 15
          $rusHash = (Get-FileHash -LiteralPath $rusModel -Algorithm SHA256).Hash
          if ($rusHash -ne $env:RUS_TRAINEDDATA_SHA256) {
            throw "SHA256 mismatch for rus.traineddata at tessdata_fast@${env:TESSDATA_REF}: got $rusHash."
          }
          $engModel = Join-Path $tessdataDir "eng.traineddata"
          if (-not (Test-Path $engModel) -or (Get-Item $engModel).Length -le 0) {
            throw "English Tesseract language model is missing."
          }
          if (-not (Test-Path $rusModel) -or (Get-Item $rusModel).Length -le 0) {
            throw "Russian Tesseract language model is missing."
          }
          $tesseract = Join-Path $tesseractRoot "tesseract.exe"
          $languages = & $tesseract --list-langs 2>&1 | ForEach-Object { "$_".Trim() }
          if ($languages -notcontains "eng" -or $languages -notcontains "rus") {
            throw "Tesseract did not load both eng and rus language models."
          }

      - name: Build application package
        run: python scripts/build_package.py

      - name: Smoke-test built package
        run: python scripts/smoke_package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
